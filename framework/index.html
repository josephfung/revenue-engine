<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revenue Growth Engine Maturity Framework</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 20px;
      gap: 16px;
    }

    .eyebrow {
      font-size: 11px;
      color: #9ca3af;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111;
      line-height: 1.3;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 5px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .download-btn:hover { background: #374151; }

    /* Desktop: full-height iframe viewer */
    .pdf-viewer {
      width: 100%;
      height: calc(100vh - 140px);
      min-height: 500px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
    }

    /* Mobile download block hidden on desktop */
    .mobile-download { display: none; }

    footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f3f4f6;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }

    footer a {
      color: #6b7280;
      text-decoration: none;
    }

    footer a:hover { color: #111; }

    /* Mobile: iframe is unreliable — swap to a big download button instead */
    @media (max-width: 767px) {
      .container { padding: 20px 16px; }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      h1 { font-size: 17px; }

      /* Hide iframe and desktop download button */
      .pdf-viewer { display: none; }
      .desktop-download { display: none; }

      /* Show prominent download CTA */
      .mobile-download { display: block; margin: 24px 0 8px; }

      .mobile-download .download-btn {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 14px;
        font-size: 15px;
        border-radius: 8px;
      }

      .file-info {
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="eyebrow">HarbourStack</div>
        <h1>Revenue Growth Engine Maturity Framework</h1>
      </div>
      <a href="revenue-growth-engine-maturity-framework.pdf"
         download
         class="download-btn desktop-download">
        ↓ Download PDF
      </a>
    </header>

    <!-- Desktop: inline viewer via browser's native PDF renderer -->
    <iframe
      class="pdf-viewer"
      src="revenue-growth-engine-maturity-framework.pdf"
      title="Revenue Growth Engine Maturity Framework"
    ></iframe>

    <!-- Mobile: inline PDF viewers are unreliable on iOS/Android — offer download instead -->
    <div class="mobile-download">
      <a href="revenue-growth-engine-maturity-framework.pdf"
         download
         class="download-btn">
        ↓ Download PDF
      </a>
      <div class="file-info">30 slides · PDF</div>
    </div>

    <footer>
      <a href="https://linkedin.com/in/josephfung" target="_blank" rel="noopener">Joseph Fung</a>
    </footer>
  </div>
</body>
</html>
